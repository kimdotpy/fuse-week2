version: '3.9'

# -----------------------------------------------------------------------------
# Two services:
#   db  — PostgreSQL 16, auto-seeded from app/sql/seed.sql on first start
#   api — FastAPI Customer API, waits for db to be healthy before starting
# -----------------------------------------------------------------------------

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    build:
      context: .
      dockerfile: Dockerfile          # postgres:16 + seed
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"       # exposes DB to host for local psql/pgAdmin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── FastAPI app ─────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api      # python:3.11-slim + FastAPI stack
    restart: unless-stopped
    env_file: .env
    environment:
      # Override HOST so the API reaches postgres via Docker's internal DNS
      POSTGRES_HOST: db
    ports:
      - "8000:8000"                   # browse API docs at http://localhost:8000/docs
    depends_on:
      db:
        condition: service_healthy    # wait until Postgres passes its health-check
    volumes:
      # Mount source for easy local development (remove in production)
      - ./app:/app/app
      - ./main.py:/app/main.py
      - ./app.log:/app/app.log        # persist logs on the host

volumes:
  postgres_data:
    driver: local
